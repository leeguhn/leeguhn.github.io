<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>vOICe vs. 360 HRTF | Research Sandbox</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="workspace">
    <section class="views" aria-label="Simulation views">
      <div class="view-card radar-card"><div class="view-label">RADAR / TOP-DOWN</div><canvas id="scene" width="700" height="700" aria-label="Top-down obstacle radar"></canvas></div>
      <div class="view-card pov-card"><div class="view-label">FIRST-PERSON VIEW / 60 DEG</div><canvas id="pov" width="900" height="360" aria-label="First-person obstacle view"></canvas></div>
    </section>
  </main>
  <aside class="inspector">
    <header><div class="eyebrow">ETRI 360 / RESEARCH SANDBOX</div><h1>vOICe vs. 360 HRTF</h1><p>Configure multiple obstacles, repeatable motion, and spatial audio conditions.</p></header>
    <div class="button-grid">
      <button id="startAudio" data-audio-state="stopped">Start Audio</button>
      <button id="modeBaseline" aria-pressed="true">the vOICe</button>
      <button id="modeHrtf" aria-pressed="false">HRTF</button>
      <button id="pauseMotion" aria-pressed="false">Pause Motion</button>
      <button id="resetScene">Reset Scene</button>
      <a class="button-link" href="./v1.0/" target="_blank" rel="noopener">Version 1.0</a>
    </div>
    <section class="panel"><div class="panel-heading"><h2>Obstacles</h2><button id="addObstacle" class="icon-button" title="Add obstacle" aria-label="Add obstacle">+</button></div><div id="obstacleList" class="obstacle-list"></div></section>
    <section id="editor" class="panel editor" hidden><div class="panel-heading"><h2 id="editorTitle">Obstacle A</h2><div><button id="duplicateObstacle" class="icon-button" title="Duplicate obstacle" aria-label="Duplicate obstacle">⧉</button><button id="removeObstacle" class="icon-button" title="Remove obstacle" aria-label="Remove obstacle">×</button></div></div><div class="form-grid">
      <label>Label<input id="obLabel" type="text" maxlength="12"></label>
      <label>Shape<select id="obShape"><option value="circle">Circle</option><option value="cube">Cube</option><option value="person">Person</option><option value="car">Car</option></select></label>
      <label>X (m)<input id="obX" type="number" step="0.1"></label><label>Z (m)<input id="obZ" type="number" step="0.1"></label>
      <label>Heading (deg)<input id="obHeading" type="number" step="5"></label><label>Width (m)<input id="obWidth" type="number" min="0.1" max="4" step="0.1"></label>
      <label>Depth (m)<input id="obDepth" type="number" min="0.1" max="4" step="0.1"></label><label>Height (m)<input id="obHeight" type="number" min="0.1" max="5" step="0.1"></label>
      <label class="check-label"><input id="obAudible" type="checkbox"> Audible source</label>
    </div><div class="motion-heading"><span>Motion</span><select id="obMotion"><option value="stationary">Stationary</option><option value="patrol">Patrol</option><option value="orbit">Orbit</option><option value="approach">Approach listener</option></select></div><div id="motionFields" class="form-grid"></div></section>
    <section class="panel"><div class="panel-heading"><h2>Scene files</h2></div><div class="button-grid two"><button id="exportScene">Export Scene</button><button id="importScene">Import Scene</button><input id="sceneFile" type="file" accept="application/json" hidden></div><div id="alert" class="alert" role="alert" hidden></div></section>
    <section class="panel frequencies"><div class="panel-heading"><h2>Frequency ranges</h2></div><div class="range-row"><span>vOICe</span><input id="voiceLow" type="number" min="80" max="12000"><input id="voiceHigh" type="number" min="100" max="16000"><button id="resetVoice" class="icon-button" title="Reset vOICe range" aria-label="Reset vOICe range">↩</button></div><div class="range-row"><span>HRTF</span><input id="hrtfLow" type="number" min="80" max="12000"><input id="hrtfHigh" type="number" min="100" max="16000"><button id="resetHrtf" class="icon-button" title="Reset HRTF range" aria-label="Reset HRTF range">↩</button></div></section>
    <pre id="telemetry" class="telemetry"></pre><button id="toggleLog" class="full-button" aria-expanded="false">Show Event Log</button><pre id="eventLog" class="event-log" hidden></pre>
  </aside>
  <script src="app.js"></script>
</body>
</html>
