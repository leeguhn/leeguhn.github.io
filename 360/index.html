<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Study 1 · Cue test bed</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="testbed" aria-label="Study 1 auditory cue test bed">
    <section class="viewport" aria-label="Scene viewport">
      <div class="scene-view primary" id="povView">
        <canvas id="pov" role="img" aria-label="First-person view"></canvas>
        <button class="swap-view" aria-label="Make first-person view the main view" title="Swap views" hidden></button>
      </div>
      <div class="scene-view inset" id="radarView">
        <canvas id="radar" role="img" aria-label="Radar, each ring is half a metre"></canvas>
        <button class="swap-view" aria-label="Make radar the main view" title="Swap views"></button>
      </div>
      <button class="icon-button shuffle" id="shuffle" aria-label="Shuffle properties and objects, reset view" title="Shuffle everything and face forward">
        <img src="assets/icons/shuffle.svg" alt="" draggable="false">
      </button>
      <button class="icon-button sound" id="sound" aria-label="Enable sound" title="Enable sound" aria-keyshortcuts="Space">
        <img src="assets/icons/volume-high.svg" alt="" draggable="false">
      </button>
    </section>
    <nav class="properties" aria-label="Study properties">
      <button id="cue" aria-label="Cue: verbal. Click to change">verbal</button>
      <button id="trigger" aria-label="Trigger: automatic. Click to change">automatic</button>
      <button id="count" aria-label="Objects: 2. Click to change">2 objects</button>
      <button id="schedule" aria-label="Playback: sequential. Click to change">sequential</button>
    </nav>
  </main>
  <footer class="hints"><span>Q / E turn</span><span>Space plays / pauses</span><span>Click inset to swap</span><span>Each ring = 0.5 m</span></footer>
  <p id="status" class="sr-only" role="status" aria-live="polite">Click the speaker to enable sound. Headphones recommended.</p>
  <script type="module" src="app.mjs"></script>
</body>
</html>
